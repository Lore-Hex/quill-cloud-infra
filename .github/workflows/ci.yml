name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Every environment, not just the first one. envs/prod was the only entry
    # here while it was the only environment; a second env added without a
    # matrix row is a Terraform config nothing ever validates, which is how a
    # broken root module reaches a `terraform apply` against production.
    strategy:
      fail-fast: false
      matrix:
        env: [envs/prod, envs/azure-prod, envs/azure-tee, envs/gcp-prod, envs/aws-eu-prod]
    defaults:
      run:
        working-directory: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # aws-eu-prod uses S3 native lockfiles, which require Terraform 1.10+.
          terraform_version: "1.10.5"
      - name: Format
        run: terraform fmt -check -recursive ../..
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
